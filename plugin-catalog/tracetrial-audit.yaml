description: "Offline, read-only execution trace auditor for Hermes Agent sessions based on the Trial by Trace 7-dimension failure-attribution methodology (Context, Execution, Governance, Lifecycle, Observability, Tooling, Verification). Separates Agent faults from Harness faults and emits a structured scorecard with evidence-backed findings and prioritized fixes. Portable Agent Plugins v1 package (plugin.json + skills/), skills only, no plugin code, no MCP server bundled. Disclosure — 100% offline and read-only: makes zero network requests, reads no credentials or environment variables, collects no telemetry, and instructs the agent not to modify workspace files during an audit."
